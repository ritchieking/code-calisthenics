<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Review Drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Practice code review on realistic pull requests. Flag lines, explain the problem, and get graded against an answer key.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a review desk. Exercise rail on the left, one pull request in focus on the right,
   comments thread inline under the line they're about, answer key lands in the same place. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --code-bg: #fbfcfd;
  --ink: #141c27;
  --muted: #5a6575;
  --line: #d8dee6;
  --accent: #2752c9;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9fa;
  --note: #9a5d00;
  --note-soft: #fdf3dd;
  --good: #1b7343;
  --good-soft: #e0f2e7;
  --part: #8a6400;
  --part-soft: #fbf0d2;
  --bad: #b8322a;
  --bad-soft: #fae5e2;
  --sev-critical: #b8322a;
  --sev-major: #b25e00;
  --sev-minor: #5a6575;
  --syn-kw: #8a3bc4;
  --syn-str: #0d7556;
  --syn-com: #7a8595;
  --syn-num: #b04d17;
  --syn-fn: #2752c9;
  --syn-ty: #a2350f;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --surface: #141b24; --surface-2: #19222d; --code-bg: #10161e;
    --ink: #e5eaf0; --muted: #94a0b1; --line: #263140;
    --accent: #7ea2ff; --accent-ink: #0b1220; --accent-soft: #1c2a48;
    --note: #f0b452; --note-soft: #2d2412;
    --good: #5fd08f; --good-soft: #13291d; --part: #e8c15a; --part-soft: #2c2610; --bad: #ff8a7f; --bad-soft: #321816;
    --sev-critical: #ff8a7f; --sev-major: #f0a24f; --sev-minor: #94a0b1;
    --syn-kw: #c99bff; --syn-str: #7fd6a8; --syn-com: #6f7c8e; --syn-num: #f2a36b; --syn-fn: #8fb0ff; --syn-ty: #f59f7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --surface: #141b24; --surface-2: #19222d; --code-bg: #10161e;
  --ink: #e5eaf0; --muted: #94a0b1; --line: #263140;
  --accent: #7ea2ff; --accent-ink: #0b1220; --accent-soft: #1c2a48;
  --note: #f0b452; --note-soft: #2d2412;
  --good: #5fd08f; --good-soft: #13291d; --part: #e8c15a; --part-soft: #2c2610; --bad: #ff8a7f; --bad-soft: #321816;
  --sev-critical: #ff8a7f; --sev-major: #f0a24f; --sev-minor: #94a0b1;
  --syn-kw: #c99bff; --syn-str: #7fd6a8; --syn-com: #6f7c8e; --syn-num: #f2a36b; --syn-fn: #8fb0ff; --syn-ty: #f59f7a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
code, pre { font-family: var(--font-mono); }

.shell { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Masthead */
.mast { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 750; letter-spacing: -0.02em; line-height: 1.05; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); max-width: 60ch; }
.tally { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
.tally div { display: flex; flex-direction: column; }
.tally b { font-family: var(--font-display); font-size: 22px; font-weight: 750; line-height: 1.1; }
.tally small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }

.layout { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 960px) { .layout { grid-template-columns: 290px minmax(0, 1fr); } }

/* Rail */
.rail { display: none; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (min-width: 960px) { .rail { display: flex; } .picker { display: none !important; } }
.tracks { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 3px 11px; font-size: 13px; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 220px); overflow-y: auto; }
.list button {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: var(--r);
  padding: 9px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
}
.list button:hover { background: var(--surface-2); }
.list button[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.list .t { font-weight: 500; font-size: 14px; line-height: 1.3; }
.list .m { grid-column: 1; font-size: 12px; color: var(--muted); }
.list .s { grid-row: 1 / span 2; grid-column: 2; }

.score-pill {
  font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.score-pill.hi { color: var(--good); background: var(--good-soft); border-color: transparent; }
.score-pill.mid { color: var(--part); background: var(--part-soft); border-color: transparent; }
.score-pill.lo { color: var(--bad); background: var(--bad-soft); border-color: transparent; }

.picker { display: flex; flex-direction: column; gap: 4px; }
.picker label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.picker select { width: 100%; padding: 9px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }

/* Pull request */
.pr { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pr-head { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.eyebrow .open { color: var(--good); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.eyebrow .open::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pr-head h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 750; letter-spacing: -0.015em; line-height: 1.15; }
.byline { color: var(--muted); font-size: 14px; }
.byline code { font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; word-break: break-all; }
.desc { margin: 0; max-width: 72ch; }

.howto {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px;
}
.howto p { margin: 0; min-width: 0; flex: 1 1 320px; }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.count-line { font-size: 13px; color: var(--muted); }

/* Diff panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.panel-head {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: center;
  padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 13px;
}
.panel-head code { font-weight: 600; word-break: break-all; }
.panel-head span { color: var(--muted); }
.code { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; background: var(--code-bg); table-layout: fixed; }
.code col.g { width: 52px; }
.code td { padding: 0; vertical-align: top; }
.lnbtn {
  width: 100%; border: 0; background: transparent; color: var(--syn-com); text-align: right;
  padding: 0 10px 0 4px; font-family: var(--font-mono); font-size: 12px; line-height: 1.6rem; height: 100%;
  font-variant-numeric: tabular-nums; position: relative;
}
.row:hover .lnbtn:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
.row:hover .lnbtn:not(:disabled)::before { content: "+"; position: absolute; left: 6px; font-weight: 600; }
.lnbtn:disabled { cursor: default; }
.src pre { margin: 0; padding: 0 14px 0 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.6rem; min-height: 1.6rem; tab-size: 2; }
.row.commented td { background: color-mix(in srgb, var(--note-soft) 70%, transparent); }
.row.iss-found td:first-child { box-shadow: inset 3px 0 0 var(--good); }
.row.iss-partial td:first-child { box-shadow: inset 3px 0 0 var(--part); }
.row.iss-missed td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.row.iss-missed td { background: color-mix(in srgb, var(--bad-soft) 60%, transparent); }
.kw { color: var(--syn-kw); } .str { color: var(--syn-str); } .com { color: var(--syn-com); font-style: italic; }
.num { color: var(--syn-num); } .fn { color: var(--syn-fn); } .ty { color: var(--syn-ty); }

.thread td { padding: 8px 12px 10px 52px; background: var(--surface); border-block: 1px solid var(--line); font-family: var(--font-body); font-size: 14px; }
@media (max-width: 560px) { .thread td { padding-left: 10px; } }
.thread .stack { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }

.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card.mine { border-color: color-mix(in srgb, var(--note) 45%, var(--line)); }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; }
.who { font-weight: 600; }
.cat { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.card p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.card .acts { margin-left: auto; display: flex; gap: 4px; }
.link { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 2px 4px; border-radius: 4px; }
.link:hover { text-decoration: underline; }
.badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.badge.good { color: var(--good); background: var(--good-soft); }
.badge.part { color: var(--part); background: var(--part-soft); }
.badge.bad { color: var(--bad); background: var(--bad-soft); }
.badge.neutral { color: var(--muted); background: var(--surface-2); }

.sev { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; }
.sev.critical { color: var(--sev-critical); } .sev.major { color: var(--sev-major); } .sev.minor { color: var(--sev-minor); }

.answer { border-left: 3px solid var(--line); }
.answer.found { border-left-color: var(--good); } .answer.partial { border-left-color: var(--part); } .answer.missed { border-left-color: var(--bad); }
.answer h3 { font-family: var(--font-body); font-size: 14px; font-weight: 600; }
.credits { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.credits span::before { content: "○ "; }
.credits span.ok { color: var(--good); }
.credits span.ok::before { content: "● "; }
.fix { margin: 2px 0 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.fix-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

/* Composer */
.composer { border: 1px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.composer fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.composer legend { font-size: 12px; color: var(--muted); margin-bottom: 6px; padding: 0; }
.composer input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
.composer .opt { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; background: var(--surface); }
.composer input[type="radio"]:checked + .opt { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.composer input[type="radio"]:focus-visible + .opt { outline: 2px solid var(--accent); outline-offset: 2px; }
.composer textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--code-bg); line-height: 1.45; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { font-size: 12px; color: var(--muted); }
.err { font-size: 13px; color: var(--bad); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 14px; font-weight: 500; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.submit-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--surface-2); }
.submit-bar p { margin: 0; font-size: 14px; color: var(--muted); }

/* Scorecard */
.scorecard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 22px; align-items: center; }
@media (max-width: 560px) { .scorecard { grid-template-columns: 1fr; } }
.big { font-family: var(--font-display); font-weight: 750; font-size: 56px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: 24px; color: var(--muted); margin-left: 2px; }
.big.hi { color: var(--good); } .big.mid { color: var(--part); } .big.lo { color: var(--bad); }
.sc-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sc-body h3 { font-size: 19px; font-weight: 750; }
.sc-body p { margin: 0; color: var(--muted); font-size: 14px; }
.sevrow { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; font-variant-numeric: tabular-nums; }
.sevrow span { display: inline-flex; align-items: center; gap: 6px; }
.sc-acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; }
details.rules { font-size: 13px; color: var(--muted); }
details.rules summary { cursor: pointer; color: var(--ink); }
details.rules p { margin: 6px 0 0; max-width: 70ch; }

.foot { color: var(--muted); font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: no-preference) {
  .card, .scorecard { animation: rise 160ms ease-out; }
  @keyframes rise { from { transform: translateY(3px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<div class="shell">
  <header class="mast">
    <div class="brand">
      <h1>Code Review <span>Drills</span></h1>
      <p>Review realistic pull requests, leave comments on the lines that matter, and get graded against an answer key.</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>

  <div class="layout">
    <nav class="rail" aria-label="Exercises">
      <div class="tracks" id="tracks"></div>
      <ul class="list" id="list"></ul>
    </nav>
    <main class="pr" id="main"></main>
  </div>

  <p class="foot">Progress is saved in this browser only.</p>
</div>

<script src="exercises.js"></script>
<script>
(function () {
  "use strict";

  var CATS = [
    { id: "bug", label: "Bug" },
    { id: "security", label: "Security" },
    { id: "performance", label: "Performance" },
    { id: "a11y", label: "Accessibility" },
    { id: "design", label: "Design & API" },
  ];
  var CAT_LABEL = {};
  CATS.forEach(function (c) { CAT_LABEL[c.id] = c.label; });
  var SEV = {
    critical: { label: "Blocker", w: 3 },
    major: { label: "Major", w: 2 },
    minor: { label: "Nit", w: 1 },
  };
  var SEV_ORDER = ["critical", "major", "minor"];
  var TRACKS = ["All", "Frontend", "Backend", "Full stack", "General"];
  var KEY = "code-review-drills:v1";

  // ---------- data ----------
  var EX = (window.EXERCISES || []).map(function (ex) {
    var code = ex.code.replace(/^\n/, "").replace(/\s+$/, "");
    var lines = code.split("\n");
    var issues = ex.issues.map(function (is, i) {
      var ln = is.at.map(function (a) {
        for (var k = 0; k < lines.length; k++) if (lines[k].indexOf(a) !== -1) return k + 1;
        return -1;
      }).filter(function (n) { return n > 0; });
      return Object.assign({}, is, { idx: i, lines: ln, first: Math.min.apply(null, ln) });
    });
    return Object.assign({}, ex, { lines: lines, issues: issues });
  });
  var BY_ID = {};
  EX.forEach(function (e) { BY_ID[e.id] = e; });

  // ---------- storage ----------
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function st(id) {
    if (!store[id]) store[id] = { comments: [], submitted: false, best: null, last: null };
    return store[id];
  }

  var ui = {
    id: null,
    track: (store._ui && store._ui.track) || "All",
    composer: null,      // { line, editId, cat, text, error }
    showCount: !!(store._ui && store._ui.showCount),
    confirmReset: false,
  };
  var hashId = (location.hash || "").replace(/^#/, "");
  ui.id = BY_ID[hashId] ? hashId : (store._ui && BY_ID[store._ui.id] ? store._ui.id : EX[0].id);
  function saveUi() { store._ui = { id: ui.id, track: ui.track, showCount: ui.showCount }; save(); }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function band(p) { return p == null ? "" : p >= 80 ? "hi" : p >= 50 ? "mid" : "lo"; }
  function uid() { return Math.random().toString(36).slice(2, 9); }

  // ---------- syntax highlighting (line by line, with block state) ----------
  var KWS = {
    js: new Set("const let var function return if else for of in while async await new class extends import export from default try catch finally throw typeof instanceof null undefined true false this type interface".split(" ")),
    py: new Set("def return if elif else for in while with as try except finally raise import from class lambda None True False not and or is pass yield".split(" ")),
    sql: new Set("BEGIN COMMIT ALTER TABLE ADD COLUMN NOT NULL UPDATE SET WHERE IS CREATE INDEX ON DROP TEXT SELECT FROM INSERT INTO VALUES DEFAULT CONCURRENTLY".split(" ")),
  };
  function span(cls, s) { return '<span class="' + cls + '">' + esc(s) + "</span>"; }
  function hl(line, lang, state) {
    var family = lang === "py" ? "py" : lang === "sql" ? "sql" : "js";
    var kws = KWS[family];
    var lc = family === "py" ? "#" : family === "sql" ? "--" : "//";
    var out = "", i = 0, L = line.length;
    while (i < L) {
      if (state.block) {
        var end = line.indexOf(state.block, i);
        var j = end < 0 ? L : end + state.block.length;
        out += span(state.cls, line.slice(i, j));
        if (end >= 0) state.block = null;
        i = j; continue;
      }
      var rest = line.slice(i);
      if (rest.indexOf(lc) === 0) { out += span("com", rest); break; }
      if (family === "js" && rest.indexOf("/*") === 0) { state.block = "*/"; state.cls = "com"; out += span("com", "/*"); i += 2; continue; }
      if (family === "py" && rest.indexOf('"""') === 0) {
        var e3 = line.indexOf('"""', i + 3);
        if (e3 < 0) { state.block = '"""'; state.cls = "str"; out += span("str", rest); break; }
        out += span("str", line.slice(i, e3 + 3)); i = e3 + 3; continue;
      }
      var ch = line[i];
      if (ch === '"' || ch === "'" || ch === "`") {
        var k = i + 1;
        while (k < L && line[k] !== ch) { if (line[k] === "\\") k++; k++; }
        out += span("str", line.slice(i, k + 1)); i = k + 1; continue;
      }
      var m = /^[A-Za-z_$][\w$]*/.exec(rest);
      if (m) {
        var w = m[0];
        var isKw = family === "sql" ? kws.has(w.toUpperCase()) : kws.has(w);
        if (isKw) out += span("kw", w);
        else if (line[i + w.length] === "(") out += span("fn", w);
        else if (family !== "sql" && /^[A-Z]/.test(w)) out += span("ty", w);
        else out += esc(w);
        i += w.length; continue;
      }
      var n = /^\d+(\.\d+)?/.exec(rest);
      if (n) { out += span("num", n[0]); i += n[0].length; continue; }
      out += esc(ch); i++;
    }
    return out;
  }

  // ---------- grading ----------
  // Each issue: 50% for a comment on its line (or an adjacent one), +25% right category, +25% comment names the cause.
  function grade(ex, comments) {
    var pairs = [];
    comments.forEach(function (c) {
      var text = (c.text || "").toLowerCase();
      ex.issues.forEach(function (is) {
        var exact = is.lines.indexOf(c.line) !== -1;
        var near = !exact && is.lines.some(function (l) { return Math.abs(l - c.line) <= 1; });
        if (!exact && !near) return;
        var catOk = is.cat.indexOf(c.cat) !== -1;
        var kwOk = is.kw.some(function (k) { return text.indexOf(k.toLowerCase()) !== -1; });
        pairs.push({ c: c, is: is, catOk: catOk, kwOk: kwOk, s: (kwOk ? 4 : 0) + (exact ? 2 : 0) + (catOk ? 1 : 0) });
      });
    });
    pairs.sort(function (a, b) { return b.s - a.s; });
    var usedC = {}, usedI = {}, results = {};
    pairs.forEach(function (p) {
      if (usedC[p.c.id] || usedI[p.is.idx]) return;
      usedC[p.c.id] = usedI[p.is.idx] = true;
      results[p.is.idx] = p;
    });
    var total = 0, earned = 0;
    var bySev = { critical: [0, 0], major: [0, 0], minor: [0, 0] };
    var rows = ex.issues.map(function (is) {
      var p = results[is.idx];
      var credit = p ? 0.5 + (p.catOk ? 0.25 : 0) + (p.kwOk ? 0.25 : 0) : 0;
      var w = SEV[is.sev].w;
      total += w; earned += w * credit;
      bySev[is.sev][1]++;
      if (p) bySev[is.sev][0]++;
      return {
        issue: is, credit: credit, commentId: p ? p.c.id : null,
        catOk: !!(p && p.catOk), kwOk: !!(p && p.kwOk),
        status: credit === 1 ? "found" : credit > 0 ? "partial" : "missed",
      };
    });
    var matched = {};
    rows.forEach(function (r) { if (r.commentId) matched[r.commentId] = r; });
    return {
      score: Math.round((earned / total) * 100),
      rows: rows, matched: matched, bySev: bySev,
      found: rows.filter(function (r) { return r.credit > 0; }).length,
      full: rows.filter(function (r) { return r.credit === 1; }).length,
      extras: comments.filter(function (c) { return !matched[c.id]; }).length,
    };
  }

  // ---------- rendering ----------
  var $ = function (id) { return document.getElementById(id); };

  function renderTally() {
    var done = EX.filter(function (e) { return store[e.id] && store[e.id].best != null; });
    var avg = done.length ? Math.round(done.reduce(function (a, e) { return a + store[e.id].best; }, 0) / done.length) : null;
    var issues = EX.reduce(function (a, e) { return a + e.issues.length; }, 0);
    $("tally").innerHTML =
      "<div><b>" + done.length + "/" + EX.length + "</b><small>Reviewed</small></div>" +
      "<div><b>" + (avg == null ? "–" : avg + "%") + "</b><small>Avg best</small></div>" +
      "<div><b>" + issues + "</b><small>Issues in bank</small></div>";
  }

  function visible() {
    return EX.filter(function (e) { return ui.track === "All" || e.track === ui.track; });
  }

  function scoreChip(id) {
    var s = store[id];
    if (!s || s.best == null) {
      return s && s.comments.length ? '<span class="score-pill">Draft</span>' : '<span class="score-pill">New</span>';
    }
    return '<span class="score-pill ' + band(s.best) + '">' + s.best + "%</span>";
  }

  function renderRail() {
    $("tracks").innerHTML = TRACKS.map(function (t) {
      return '<button class="chip" data-action="track" data-track="' + esc(t) + '" aria-pressed="' + (ui.track === t) + '">' + esc(t) + "</button>";
    }).join("");
    $("list").innerHTML = visible().map(function (e) {
      return '<li><button data-action="open" data-id="' + e.id + '" aria-current="' + (e.id === ui.id) + '">' +
        '<span class="t">' + esc(e.title) + "</span>" +
        '<span class="m">' + esc(e.track) + " · " + esc(e.level) + " · " + e.issues.length + " issues</span>" +
        '<span class="s">' + scoreChip(e.id) + "</span></button></li>";
    }).join("");
  }

  function picker() {
    return '<div class="picker"><label for="ex-picker">Exercise</label><select id="ex-picker" data-action="pick">' +
      TRACKS.slice(1).map(function (t) {
        return '<optgroup label="' + esc(t) + '">' + EX.filter(function (e) { return e.track === t; }).map(function (e) {
          var s = store[e.id];
          var tag = s && s.best != null ? " (" + s.best + "%)" : "";
          return '<option value="' + e.id + '"' + (e.id === ui.id ? " selected" : "") + ">" + esc(e.title + tag) + "</option>";
        }).join("") + "</optgroup>";
      }).join("") + "</select></div>";
  }

  function countLine(ex) {
    var c = { critical: 0, major: 0, minor: 0 };
    ex.issues.forEach(function (i) { c[i.sev]++; });
    return ex.issues.length + " planted issues: " + SEV_ORDER.filter(function (s) { return c[s]; }).map(function (s) {
      return c[s] + " " + SEV[s].label.toLowerCase() + (c[s] > 1 ? "s" : "");
    }).join(", ");
  }

  function commentCard(c, s, g) {
    var top = '<span class="who">You</span><span class="cat">' + esc(CAT_LABEL[c.cat] || c.cat) + "</span>";
    if (s.submitted && g) {
      var r = g.matched[c.id];
      top += r
        ? '<span class="badge ' + (r.status === "found" ? "good" : "part") + '">Matched: ' + esc(r.issue.title) + "</span>"
        : '<span class="badge neutral">Not in the answer key</span>';
    } else {
      top += '<span class="acts"><button class="link" data-action="edit" data-cid="' + c.id + '">Edit</button>' +
        '<button class="link" data-action="delete" data-cid="' + c.id + '">Delete</button></span>';
    }
    return '<div class="card mine"><div class="card-top">' + top + "</div><p>" + esc(c.text) + "</p></div>";
  }

  function composerCard(line) {
    var c = ui.composer;
    return '<form class="card composer" data-form="composer">' +
      '<fieldset><legend>Comment on line ' + line + ". What kind of problem is it?</legend>" +
      CATS.map(function (k) {
        return '<input type="radio" name="cat" id="cat-' + k.id + '" value="' + k.id + '"' + (c.cat === k.id ? " checked" : "") + ">" +
          '<label class="opt" for="cat-' + k.id + '">' + k.label + "</label>";
      }).join("") + "</fieldset>" +
      '<label class="hint" for="composer-text">Explain the problem and why it matters</label>' +
      '<textarea id="composer-text" placeholder="e.g. This runs on every render because…">' + esc(c.text || "") + "</textarea>" +
      (c.error ? '<div class="err" role="alert">' + esc(c.error) + "</div>" : "") +
      '<div class="row-btns"><button class="btn primary" type="submit">' + (c.editId ? "Save comment" : "Add comment") + "</button>" +
      '<button class="btn" type="button" data-action="cancel">Cancel</button>' +
      '<span class="hint">Ctrl or ⌘ + Enter to save</span></div></form>';
  }

  function answerCard(r) {
    var is = r.issue;
    var badge = r.status === "found" ? '<span class="badge good">Full credit</span>'
      : r.status === "partial" ? '<span class="badge part">Partial credit</span>'
      : '<span class="badge bad">Missed</span>';
    var lines = is.lines.length > 1 ? "Lines " + is.lines.join(", ") : "Line " + is.lines[0];
    return '<div class="card answer ' + r.status + '">' +
      '<div class="card-top"><span class="sev ' + is.sev + '">' + SEV[is.sev].label + "</span>" + badge +
      '<span class="hint">' + lines + " · " + is.cat.map(function (c) { return CAT_LABEL[c]; }).join(" or ") + "</span></div>" +
      "<h3>" + esc(is.title) + "</h3>" +
      (r.status !== "missed"
        ? '<div class="credits"><span class="ok">Right line</span><span class="' + (r.catOk ? "ok" : "") + '">Right category</span><span class="' + (r.kwOk ? "ok" : "") + '">Named the cause</span></div>'
        : "") +
      "<p>" + esc(is.why) + "</p>" +
      '<div class="fix-label">Suggested fix</div><pre class="fix">' + esc(is.fix) + "</pre></div>";
  }

  function scorecard(ex, g) {
    var verdict = g.score >= 90 ? "Ready to review for real" : g.score >= 70 ? "Solid review" : g.score >= 40 ? "Caught some of it" : "Lots slipped through";
    var idx = EX.indexOf(ex);
    var next = EX[(idx + 1) % EX.length];
    return '<section class="scorecard" id="scorecard" aria-live="polite">' +
      '<div class="big ' + band(g.score) + '">' + g.score + "<small>%</small></div>" +
      '<div class="sc-body"><h3>' + verdict + "</h3>" +
      "<p>You found " + g.found + " of " + ex.issues.length + " issues, " + g.full + " with full credit." +
      (g.extras ? " " + g.extras + " of your comments " + (g.extras > 1 ? "aren't" : "isn't") + " in the answer key; " + (g.extras > 1 ? "they" : "it") + " may still be a fair point." : "") + "</p>" +
      '<div class="sevrow">' + SEV_ORDER.filter(function (s) { return g.bySev[s][1]; }).map(function (s) {
        return '<span><span class="sev ' + s + '">' + SEV[s].label + "</span>" + g.bySev[s][0] + " of " + g.bySev[s][1] + "</span>";
      }).join("") + "</div>" +
      '<details class="rules"><summary>How this is scored</summary><p>Blockers are worth 3 points, majors 2, nits 1. A comment on the issue\'s line, or the line next to it, earns half. Choosing a matching category adds a quarter, and naming the actual cause in your comment adds the last quarter. Each comment counts toward one issue, so leave one comment per problem.</p></details>' +
      "</div>" +
      '<div class="sc-acts"><button class="btn primary" data-action="open" data-id="' + next.id + '">Next: ' + esc(next.title) + "</button>" +
      '<button class="btn" data-action="unsubmit">Edit my review</button>' +
      '<button class="btn danger" data-action="reset">' + (ui.confirmReset ? "Click again to clear all comments" : "Start over") + "</button></div>" +
      "</section>";
  }

  function renderMain() {
    var ex = BY_ID[ui.id];
    var s = st(ex.id);
    var g = s.submitted ? grade(ex, s.comments) : null;
    var byLine = {};
    s.comments.forEach(function (c) { (byLine[c.line] = byLine[c.line] || []).push(c); });
    var issueAt = {}, lineStatus = {};
    if (g) {
      var rank = { missed: 3, partial: 2, found: 1 };
      g.rows.forEach(function (r) {
        (issueAt[r.issue.first] = issueAt[r.issue.first] || []).push(r);
        r.issue.lines.forEach(function (l) {
          if (!lineStatus[l] || rank[r.status] > rank[lineStatus[l]]) lineStatus[l] = r.status;
        });
      });
    }

    var state = { block: null, cls: null };
    var rows = ex.lines.map(function (text, i) {
      var n = i + 1;
      var cls = "row" + (byLine[n] ? " commented" : "") + (lineStatus[n] ? " iss-" + lineStatus[n] : "");
      var html = '<tr class="' + cls + '"><td><button class="lnbtn" data-action="compose" data-line="' + n + '"' +
        (s.submitted ? " disabled" : "") + ' aria-label="Comment on line ' + n + '">' + n + "</button></td>" +
        '<td class="src"><pre>' + (hl(text, ex.lang, state) || " ") + "</pre></td></tr>";
      var inner = (byLine[n] || []).filter(function (c) { return !(ui.composer && ui.composer.editId === c.id); })
        .map(function (c) { return commentCard(c, s, g); }).join("");
      if (ui.composer && ui.composer.line === n && !s.submitted) inner += composerCard(n);
      if (issueAt[n]) inner += issueAt[n].map(answerCard).join("");
      if (inner) html += '<tr class="thread"><td colspan="2"><div class="stack">' + inner + "</div></td></tr>";
      return html;
    }).join("");

    var n = s.comments.length;
    $("main").innerHTML =
      picker() +
      '<header class="pr-head">' +
      '<div class="eyebrow"><span class="open">Open</span><span>' + esc(ex.track) + "</span><span>" + esc(ex.level) + "</span><span>" + esc(ex.lang.toUpperCase()) + "</span></div>" +
      "<h2>" + esc(ex.title) + "</h2>" +
      '<div class="byline"><b>' + esc(ex.author) + "</b> wants to merge into <code>main</code></div>" +
      '<p class="desc">' + esc(ex.description) + "</p></header>" +
      (g ? scorecard(ex, g) : "") +
      (s.submitted ? "" :
        '<div class="howto"><p>Click a line number to comment. Leave one comment per problem, pick its category, and say why it matters. Submit when you\'d hit "Request changes".</p>' +
        '<button class="toggle" data-action="count" aria-pressed="' + ui.showCount + '">' + (ui.showCount ? "Hide issue count" : "Show issue count") + "</button>" +
        (ui.showCount ? '<span class="count-line">' + countLine(ex) + "</span>" : "") + "</div>") +
      '<section class="panel" aria-label="Changed file">' +
      '<div class="panel-head"><code>' + esc(ex.file) + "</code><span>" + ex.lines.length + " lines added</span></div>" +
      '<table class="code"><colgroup><col class="g"><col></colgroup><tbody>' + rows + "</tbody></table>" +
      (s.submitted ? "" :
        '<div class="submit-bar"><p>' + (n ? n + " comment" + (n > 1 ? "s" : "") + " on this pull request" : "No comments yet") + "</p>" +
        '<div class="row-btns">' + (n ? '<button class="btn danger" data-action="reset">' + (ui.confirmReset ? "Click again to clear" : "Clear") + "</button>" : "") +
        '<button class="btn primary" data-action="submit"' + (n ? "" : " disabled") + ">Submit review</button></div></div>") +
      "</section>";
  }

  function render() {
    renderTally();
    renderRail();
    renderMain();
  }

  // ---------- actions ----------
  function readComposer() {
    var f = document.querySelector('[data-form="composer"]');
    if (!f || !ui.composer) return;
    var r = f.querySelector('input[name="cat"]:checked');
    ui.composer.cat = r ? r.value : ui.composer.cat;
    ui.composer.text = f.querySelector("textarea").value;
  }
  function focusComposer() {
    var t = document.getElementById("composer-text");
    if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }
  function saveComment() {
    readComposer();
    var c = ui.composer;
    if (!c.cat) { c.error = "Pick a category first."; renderMain(); focusComposer(); return; }
    if (!c.text || !c.text.trim()) { c.error = "Write a sentence about what's wrong."; renderMain(); focusComposer(); return; }
    var s = st(ui.id);
    if (c.editId) {
      s.comments.forEach(function (x) { if (x.id === c.editId) { x.cat = c.cat; x.text = c.text.trim(); } });
    } else {
      s.comments.push({ id: uid(), line: c.line, cat: c.cat, text: c.text.trim() });
    }
    ui.composer = null;
    save(); render();
  }

  function open(id) {
    ui.id = id; ui.composer = null; ui.confirmReset = false;
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    saveUi(); render();
    var m = $("main");
    if (m.getBoundingClientRect().top < 0) m.scrollIntoView({ block: "start" });
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (!b || b.tagName === "SELECT") return;
    var a = b.getAttribute("data-action");
    var s = st(ui.id);
    if (a !== "reset") ui.confirmReset = false;
    if (a === "open") return open(b.getAttribute("data-id"));
    if (a === "track") { ui.track = b.getAttribute("data-track"); saveUi(); return renderRail(); }
    if (a === "count") { ui.showCount = !ui.showCount; saveUi(); return renderMain(); }
    if (a === "compose") {
      readComposer();
      var line = +b.getAttribute("data-line");
      if (ui.composer && ui.composer.line === line && !ui.composer.editId) { renderMain(); return focusComposer(); }
      ui.composer = { line: line, cat: ui.composer && !ui.composer.editId ? ui.composer.cat : null, text: "", editId: null };
      renderMain(); return focusComposer();
    }
    if (a === "cancel") { ui.composer = null; return renderMain(); }
    if (a === "edit") {
      var c = s.comments.filter(function (x) { return x.id === b.getAttribute("data-cid"); })[0];
      if (!c) return;
      ui.composer = { line: c.line, cat: c.cat, text: c.text, editId: c.id };
      renderMain(); return focusComposer();
    }
    if (a === "delete") {
      s.comments = s.comments.filter(function (x) { return x.id !== b.getAttribute("data-cid"); });
      save(); return render();
    }
    if (a === "submit") {
      if (!s.comments.length) return;
      var g = grade(BY_ID[ui.id], s.comments);
      s.submitted = true; s.last = g.score; s.best = s.best == null ? g.score : Math.max(s.best, g.score);
      ui.composer = null; save(); render();
      var sc = $("scorecard"); if (sc) sc.scrollIntoView({ block: "start", behavior: "smooth" });
      return;
    }
    if (a === "unsubmit") { s.submitted = false; save(); return render(); }
    if (a === "reset") {
      if (!ui.confirmReset) { ui.confirmReset = true; return renderMain(); }
      ui.confirmReset = false; s.comments = []; s.submitted = false; ui.composer = null;
      save(); return render();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "ex-picker") open(e.target.value);
    if (e.target.name === "cat" && ui.composer) ui.composer.cat = e.target.value;
  });
  document.addEventListener("submit", function (e) {
    if (e.target.getAttribute("data-form") === "composer") { e.preventDefault(); saveComment(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "composer-text" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveComment(); }
    if (e.key === "Escape" && ui.composer) { ui.composer = null; renderMain(); }
  });
  window.addEventListener("hashchange", function () {
    var id = location.hash.replace(/^#/, "");
    if (BY_ID[id] && id !== ui.id) open(id);
  });

  render();
})();
</script>
</body>
</html>
